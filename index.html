<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz à deux</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #231f1a; --muted: #7a7166;
    --accent: #c2410c; --accent-soft: #ffedd5; --border: #e7dfd3;
    --me: #1d4ed8; --them: #be185d; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --card: #221e17; --text: #f3ede3; --muted: #a39a8c;
      --accent: #fb923c; --accent-soft: #3a2a18; --border: #373025;
      --me: #60a5fa; --them: #f472b6; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 20px 14px 40px;
  }
  main { width: 100%; max-width: 520px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 20px; margin-top: 14px;
  }
  h1 { font-size: 1.7rem; margin: 8px 0 4px; text-align: center; }
  h2 { font-size: 1.25rem; line-height: 1.35; margin: 14px 0 16px; }
  p { line-height: 1.5; }
  .muted { color: var(--muted); text-align: center; margin-top: 0; }
  button, input {
    font: inherit; border-radius: 12px; border: 1px solid var(--border);
    padding: 13px 16px; width: 100%; color: var(--text); background: var(--card);
  }
  button { cursor: pointer; text-align: left; margin-top: 10px; }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
    text-align: center; font-weight: 600;
  }
  button:disabled { cursor: default; }
  .choice { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .choice:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
  .choice.mine { border-color: var(--me); }
  .choice.theirs { border-color: var(--them); }
  .choice.mine.theirs { border-color: var(--ok); background: var(--accent-soft); }
  .tags { display: flex; gap: 6px; flex-shrink: 0; }
  .tag { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: #fff; }
  .tag.me { background: var(--me); } .tag.them { background: var(--them); }
  .bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .count { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
  img.qimg { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; margin-top: 14px; }
  .code {
    font-size: 2.4rem; font-weight: 800; letter-spacing: .25em; text-align: center;
    background: var(--accent-soft); border-radius: 14px; padding: 14px 0 14px .25em; margin: 14px 0;
  }
  input { text-transform: uppercase; text-align: center; letter-spacing: .2em; font-weight: 700; margin-top: 10px; }
  .verdict { text-align: center; font-weight: 600; margin: 16px 0 4px; }
  .sep { text-align: center; color: var(--muted); margin: 18px 0 4px; font-size: .9rem; }
  .row { padding: 12px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row b { display: block; margin-bottom: 6px; font-size: .95rem; }
  .row span { font-size: .88rem; display: block; }
  .big { font-size: 2.6rem; font-weight: 800; text-align: center; margin: 6px 0; color: var(--accent); }
  .error { color: #b91c1c; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const TOTAL = 20;

// Copie de secours, utilisée seulement si questions.json est introuvable
// (par exemple si la page est ouverte en double-cliquant sur le fichier).
const FALLBACK_QUESTIONS = [
  { text: "Aimes-tu le café ?", choices: ["Oui", "Non"], image: null },
  { text: "Plutôt thé ou café le matin ?", choices: ["Thé", "Café", "Aucun des deux"], image: null },
  { text: "Tu préfères la mer ou la montagne ?", choices: ["La mer", "La montagne"], image: null },
  { text: "Tu es plutôt lève-tôt ou couche-tard ?", choices: ["Lève-tôt", "Couche-tard"], image: null },
  { text: "Quel est ton plat préféré ?", choices: ["Couscous", "Chakhchoukha", "Pizza", "Autre"], image: null },
  { text: "Tu préfères l'été ou l'hiver ?", choices: ["L'été", "L'hiver"], image: null },
  { text: "Tu préfères les chats ou les chiens ?", choices: ["Les chats", "Les chiens", "Les deux", "Aucun"], image: null },
  { text: "Tu préfères voyager seul(e) ou en groupe ?", choices: ["Seul(e)", "En groupe"], image: null },
  { text: "Tu préfères lire un livre ou regarder un film ?", choices: ["Un livre", "Un film"], image: null },
  { text: "Tu préfères le sucré ou le salé ?", choices: ["Le sucré", "Le salé"], image: null },
  { text: "Tu es plutôt ville ou campagne ?", choices: ["Ville", "Campagne"], image: null },
  { text: "Tu aimes les surprises ?", choices: ["Oui", "Non", "Ça dépend"], image: null },
  { text: "Quel super-pouvoir choisirais-tu ?", choices: ["Voler", "Être invisible", "Lire dans les pensées", "Voyager dans le temps"], image: null },
  { text: "Tu préfères la musique calme ou rythmée ?", choices: ["Calme", "Rythmée"], image: null },
  { text: "Tu préfères cuisiner ou manger au restaurant ?", choices: ["Cuisiner", "Restaurant"], image: null },
  { text: "Tu es plutôt organisé(e) ou spontané(e) ?", choices: ["Organisé(e)", "Spontané(e)"], image: null },
  { text: "Tu préfères les vacances actives ou reposantes ?", choices: ["Actives", "Reposantes"], image: null },
  { text: "Tu aimes le football ?", choices: ["Oui, passionnément", "Un peu", "Pas du tout"], image: null },
  { text: "Tu préfères un grand mariage ou une petite fête intime ?", choices: ["Grand mariage", "Petite fête"], image: null },
  { text: "Tu préfères les glaces ou les gâteaux ?", choices: ["Les glaces", "Les gâteaux"], image: null },
  { text: "Tu préfères offrir ou recevoir un cadeau ?", choices: ["Offrir", "Recevoir"], image: null },
  { text: "Tu serais plutôt…", choices: ["Toujours en avance", "À l'heure pile", "Un peu en retard"], image: null }
];

const PREFIX = 'quizduo-';
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

let peer = null, conn = null;
let questions = [], idx = 0, mine = [], theirs = [], finished = false;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const genCode = () => Array.from({length: 5}, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join('');

/* ---------- Écrans ---------- */

function screenHome() {
  app.innerHTML = `
    <h1>☕ Quiz à deux</h1>
    <p class="muted">20 questions, pas de bonne réponse. Découvrez ce que l'autre a répondu.</p>
    <div class="card">
      <button class="primary" id="btnCreate">Créer une partie</button>
      <p class="sep">— ou —</p>
      <input id="codeInput" maxlength="5" placeholder="CODE" autocomplete="off">
      <button class="primary" id="btnJoin">Rejoindre avec ce code</button>
    </div>`;
  document.getElementById('btnCreate').onclick = createGame;
  document.getElementById('btnJoin').onclick = () => {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length === 5) joinGame(code);
  };
}

function screenMessage(text, isError = false, withHome = true) {
  app.innerHTML = `
    <h1>☕ Quiz à deux</h1>
    <div class="card">
      <p class="${isError ? 'error' : 'muted'}">${esc(text)}</p>
      ${withHome ? '<button class="primary" id="btnHome">Retour à l\'accueil</button>' : ''}
    </div>`;
  if (withHome) document.getElementById('btnHome').onclick = () => location.reload();
}

function screenWaiting(code) {
  app.innerHTML = `
    <h1>☕ Quiz à deux</h1>
    <div class="card">
      <p class="muted">Donne ce code à l'autre joueur :</p>
      <div class="code">${esc(code)}</div>
      <p class="muted">En attente de l'autre joueur…<br>Garde cette page ouverte.</p>
    </div>`;
}

function render() {
  if (idx >= questions.length) return screenSummary();
  const q = questions[idx];
  const iAnswered = mine[idx] !== undefined;
  const theyAnswered = theirs[idx] !== undefined;
  const both = iAnswered && theyAnswered;
  const last = idx === questions.length - 1;

  const choices = q.choices.map((c, i) => {
    const isMine = iAnswered && mine[idx] === i;
    const isTheirs = both && theirs[idx] === i;
    const cls = ['choice', isMine ? 'mine' : '', isTheirs ? 'theirs' : ''].join(' ');
    const tags = both
      ? `<span class="tags">${isMine ? '<span class="tag me">Toi</span>' : ''}${isTheirs ? '<span class="tag them">L\'autre</span>' : ''}</span>`
      : (isMine ? '<span class="tags"><span class="tag me">Toi</span></span>' : '');
    return `<button class="${cls}" data-i="${i}" ${iAnswered ? 'disabled' : ''}><span>${esc(c)}</span>${tags}</button>`;
  }).join('');

  let footer = '';
  if (iAnswered && !theyAnswered) {
    footer = '<p class="muted" style="margin-top:18px">⏳ En attente de la réponse de l\'autre joueur…</p>';
  } else if (both) {
    const same = mine[idx] === theirs[idx];
    footer = `
      <p class="verdict">${same ? '🎉 Vous avez répondu pareil !' : '🤔 Réponses différentes !'}</p>
      <button class="primary" id="btnNext">${last ? 'Voir le résultat' : 'Question suivante →'}</button>`;
  }

  app.innerHTML = `
    <div class="bar"><div style="width:${(idx / questions.length) * 100}%"></div></div>
    <p class="count">Question ${idx + 1} / ${questions.length}</p>
    <div class="card">
      ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="" onerror="this.remove()">` : ''}
      <h2>${esc(q.text)}</h2>
      ${choices}
      ${footer}
    </div>`;

  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(Number(b.dataset.i)));
  const next = document.getElementById('btnNext');
  if (next) next.onclick = () => { idx++; render(); window.scrollTo(0, 0); };
}

function screenSummary() {
  finished = true;
  let same = 0;
  const rows = questions.map((q, i) => {
    if (mine[i] === theirs[i]) same++;
    return `<div class="row"><b>${i + 1}. ${esc(q.text)}</b>
      <span style="color:var(--me)">Toi : ${esc(q.choices[mine[i]])}</span>
      <span style="color:var(--them)">L'autre : ${esc(q.choices[theirs[i]])}</span></div>`;
  }).join('');
  app.innerHTML = `
    <h1>☕ Résultat</h1>
    <div class="card">
      <div class="big">${same} / ${questions.length}</div>
      <p class="muted">réponses identiques</p>
      <button class="primary" id="btnAgain">Nouvelle partie</button>
    </div>
    <div class="card">${rows}</div>`;
  document.getElementById('btnAgain').onclick = () => location.reload();
  if (conn) conn.close();
}

/* ---------- Logique de jeu ---------- */

function answer(i) {
  if (mine[idx] !== undefined) return;
  mine[idx] = i;
  conn.send({ t: 'answer', q: idx, a: i });
  render();
}

function beginGame(list) {
  questions = list; idx = 0; mine = []; theirs = []; finished = false;
  render();
}

function onData(d) {
  if (!d || !d.t) return;
  if (d.t === 'start') beginGame(d.questions);
  else if (d.t === 'answer') { theirs[d.q] = d.a; if (!finished) render(); }
  else if (d.t === 'full') screenMessage('Cette partie a déjà deux joueurs.', true);
}

function wireConn(c) {
  c.on('data', onData);
  c.on('close', () => { if (!finished) screenMessage('L\'autre joueur s\'est déconnecté.', true); });
  c.on('error', () => { if (!finished) screenMessage('Erreur de connexion.', true); });
}

/* ---------- Hôte ---------- */

async function createGame() {
  let pool;
  try {
    const res = await fetch('questions.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    pool = (await res.json()).questions;
    if (!Array.isArray(pool) || !pool.length) throw new Error('JSON vide ou invalide');
  } catch (err) {
    console.warn('questions.json non chargé (' + err.message + '), utilisation des questions intégrées.');
    pool = FALLBACK_QUESTIONS;
  }

  screenMessage('Création de la partie…', false, false);
  const code = genCode();
  peer = new Peer(PREFIX + code);

  peer.on('open', () => screenWaiting(code));

  peer.on('connection', c => {
    if (conn) {                       // deux joueurs maximum
      c.on('open', () => { c.send({ t: 'full' }); setTimeout(() => c.close(), 400); });
      return;
    }
    conn = c;
    wireConn(c);
    const start = () => {
      const list = shuffle(pool).slice(0, TOTAL);
      c.send({ t: 'start', questions: list });
      beginGame(list);
    };
    c.open ? start() : c.on('open', start);
  });

  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); createGame(); }
    else if (!conn) screenMessage('Erreur réseau (' + e.type + ')', true);
  });
}

/* ---------- Invité ---------- */

function joinGame(code) {
  screenMessage('Connexion…', false, false);
  peer = new Peer();
  const timeout = setTimeout(() => { if (!conn || !conn.open) screenMessage('Connexion impossible. Vérifie le code.', true); }, 12000);

  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    wireConn(conn);
    conn.on('open', () => { clearTimeout(timeout); screenMessage('Connecté ! La partie démarre…', false, false); });
  });

  peer.on('error', e => {
    clearTimeout(timeout);
    screenMessage(e.type === 'peer-unavailable' ? 'Code introuvable.' : 'Erreur réseau (' + e.type + ')', true);
  });
}

screenHome();
</script>
</body>
</html>
